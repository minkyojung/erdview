name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: x }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      ERDVIEW_TEST_PG: postgresql://postgres:x@localhost:5433/postgres
      CHROME: /usr/bin/google-chrome   # preinstalled on ubuntu runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev,mcp]'
      - run: python -m pytest -q -ra tests
      - name: make sure nothing was skipped for lack of Postgres or Chrome
        run: python -m pytest -q -ra tests 2>&1 | tee /tmp/out; ! grep -E "SKIPPED.*(Postgres|Chrome)" /tmp/out

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" erdview/viewer.html --title "erdview ${GITHUB_REF_NAME#v}" --generate-notes || gh release upload "$GITHUB_REF_NAME" erdview/viewer.html --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
