[project]
name = "erdview"
version = "0.1.0"
description = "Interactive ERD for any database: one read-only query (PostgreSQL) or a tbls JSON, one HTML file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
erdview = "erdview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["erdview"]

[tool.setuptools.package-data]
erdview = ["pg_erd.sql", "viewer.html"]
